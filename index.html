<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madeira Source</title>
<style>
  :root {
    color-scheme: light dark;
    --accent: #2E7D5B;
    --bg: #f6f7f6; --card: #fff; --text: #141614; --muted: #6b716c; --line: #e3e6e3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e100f; --card: #181b19; --text: #eef1ee; --muted: #9aa29c; --line: #2a2f2c; }
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text);
         max-width: 480px; margin: 0 auto; padding: 28px 18px 40px; line-height: 1.45; }
  header { display: flex; gap: 14px; align-items: center; margin-bottom: 22px; }
  header img, header .icon { width: 68px; height: 68px; border-radius: 16px; background: var(--line); }
  h1 { font-size: 1.35rem; margin: 0; }
  .sub { color: var(--muted); margin: 2px 0 0; font-size: .9rem; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
         padding: 14px; border-radius: 12px; border: 0; font: inherit; font-weight: 600;
         text-decoration: none; cursor: pointer; margin: 10px 0; }
  .primary { background: var(--accent); color: #fff; }
  .secondary { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .secondary[aria-disabled="true"] { opacity: .45; pointer-events: none; }

  details { margin: 10px 0; }
  summary { list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary .chev { transition: transform .2s; }
  details[open] summary .chev { transform: rotate(180deg); }
  details[open] + .btn { margin-top: 22px; }

  .menu { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .item { display: flex; align-items: center; justify-content: space-between; width: 100%;
          padding: 13px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          color: var(--text); font: inherit; text-decoration: none; text-align: left; cursor: pointer; }
  .item:active { background: var(--line); }
  .item .hint { color: var(--muted); font-size: .85rem; }
  .item.copy { font-weight: 600; color: var(--accent); border-color: var(--accent); margin-bottom: 14px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 14px 16px; margin: 18px 0; }
  .card h2 { font-size: .95rem; margin: 0 0 6px; }
  section + section { margin-top: 34px; padding-top: 26px; border-top: 1px solid var(--line); }
  .tag { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .06em;
         text-transform: uppercase; padding: 3px 8px; border-radius: 6px; margin-bottom: 4px;
         background: var(--line); color: var(--muted); }
  .tag.nightly { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
  .notes-text { white-space: pre-wrap; margin: 0; font-size: .9rem; color: var(--muted); }
  footer { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 24px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main id="channels"></main>

<footer>
  Nightly from <a href="https://github.com/camhoc/Madeira">camhoc/Madeira</a> ·
  Stable from <a href="https://github.com/willfaust/Madeira">willfaust/Madeira</a><br>
  Both use the same bundle ID: installing one replaces the other.
</footer>

<template id="channel-tpl">
  <section>
    <header>
      <img class="icon" alt="">
      <div>
        <span class="tag"></span>
        <h1 class="name">Madeira</h1>
        <p class="sub ver">Loading…</p>
      </div>
    </header>

    <details>
      <summary class="btn primary">Add Source <span class="chev">▾</span></summary>
      <div class="menu">
        <button class="item copy" type="button">
          <span class="copy-label">Copy source URL</span><span class="hint">Clipboard</span>
        </button>
      </div>
    </details>

    <a class="btn secondary download" aria-disabled="true">Download latest IPA</a>

    <div class="card notes" hidden>
      <h2>Latest build</h2>
      <p class="notes-text"></p>
    </div>
  </section>
</template>

<script>
  const CHANNELS = [
    { file: "source.json", label: "Nightly", cls: "nightly" },
    { file: "stable.json", label: "Stable",  cls: "stable" },
  ];

  // Sideloader URL schemes (same set altdirect supports).
  const LOADERS = [
    { name: "AltStore",      href: s => "altstore://source?url=" + s },
    { name: "SideStore",     href: s => "sidestore://source?url=" + s },
    { name: "LiveContainer", href: s => "livecontainer://source?url=" + s },
    { name: "Feather",       href: s => "feather://source/" + s },
    { name: "StikStore",     href: s => "stikstore://add-source?url=" + encodeURIComponent(s) },
    { name: "TrollApps",     href: s => "trollapps://add?url=" + s },
  ];

  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; }
    catch {
      const ta = document.createElement("textarea");
      ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
      let ok = false; try { ok = document.execCommand("copy"); } catch {}
      ta.remove(); return ok;
    }
  }

  const tpl = document.getElementById("channel-tpl");
  const root = document.getElementById("channels");

  for (const ch of CHANNELS) {
    const src = new URL(ch.file, location.href).href;
    const el = tpl.content.firstElementChild.cloneNode(true);
    const $ = sel => el.querySelector(sel);
    root.appendChild(el);

    $(".tag").textContent = ch.label;
    $(".tag").classList.add(ch.cls);

    const menu = $(".menu");
    for (const l of LOADERS) {
      const a = document.createElement("a");
      a.className = "item";
      a.href = l.href(src);
      a.innerHTML = `<span></span><span class="hint">Open ›</span>`;
      a.firstChild.textContent = l.name;
      menu.appendChild(a);
    }

    const label = $(".copy-label");
    $(".copy").addEventListener("click", async () => {
      const ok = await copyText(src);
      label.textContent = ok ? "Copied!" : src;
      if (ok) setTimeout(() => (label.textContent = "Copy source URL"), 1800);
    });

    fetch(src, { cache: "no-store" }).then(r => r.json()).then(s => {
      const app = s.apps[0], v = (app.versions || [])[0];
      $(".icon").src = app.iconURL;
      $(".name").textContent = app.name;
      if (!v) { $(".ver").textContent = "No builds yet"; return; }
      $(".ver").textContent =
        `${v.marketingVersion || v.version} · build ${v.buildVersion} · ${new Date(v.date).toLocaleDateString()}`;
      const dl = $(".download");
      dl.href = v.downloadURL;
      dl.removeAttribute("aria-disabled");
      dl.textContent = "Download latest IPA" + (v.size ? ` (${Math.round(v.size / 1048576)} MB)` : "");
      if (v.localizedDescription) {
        $(".notes").hidden = false;
        $(".notes-text").textContent = v.localizedDescription;
      }
    }).catch(() => { $(".ver").textContent = "Couldn't load " + ch.file; });
  }
</script>
</body>
</html>
